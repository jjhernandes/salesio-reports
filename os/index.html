.aos-glow { position: absolute; left: 0; top: 0; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(0,240,255,.16), rgba(183,124,255,.07) 40%, transparent 70%); mix-blend-mode: screen; opacity: 0; transition: opacity .4s; will-change: transform; }
.aos-corner { position: absolute; width: 18px; height: 18px; border: 2px solid rgba(0,240,255,.7); pointer-events: none; filter: drop-shadow(0 0 6px #00F0FF); }
.aos-hud { position: absolute; left: 14px; top: 14px; right: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: flex-start; pointer-events: none; }
.aos-crumb { font-size: 11px; letter-spacing: .16em; color: #b9c2ee; padding: 7px 12px; border-radius: 12px; background: linear-gradient(160deg, rgba(20,24,60,.62), rgba(8,10,28,.5)); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 70%; line-height: 1.5; text-transform: uppercase; }
.aos-crumb em { font-style: normal; color: var(--c); text-shadow: 0 0 10px var(--c); }
.aos-btns { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
.aos-btn { cursor: pointer; font-size: 11.5px; letter-spacing: .08em; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(0,240,255,.5); background: linear-gradient(160deg, rgba(0,240,255,.14), rgba(0,240,255,.04)); color: #8be9ff; user-select: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all .2s; }
.aos-btn:hover { background: #00F0FF; color: #03040b; box-shadow: 0 0 20px #00F0FF; transform: translateY(-1px); }
.aos-boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.aos-bootin { font-size: clamp(11px, 1.6vw, 14px); line-height: 1.9; color: #8be9ff; text-shadow: 0 0 10px rgba(0,240,255,.8), -1px 0 rgba(255,40,120,.6), 1px 0 rgba(0,240,255,.6); white-space: pre-wrap; padding: 20px; max-width: 92%; }
.aos-skip { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: .3em; color: #6f78a8; pointer-events: none; }
.aos-glass { position: relative; border-radius: 20px; background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.015)); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 20px 60px -30px var(--c), inset 0 1px 0 rgba(255,255,255,.14); overflow: hidden; }
.aos-glass:before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--c), transparent); box-shadow: 0 0 18px var(--c); }
.aos-feed { padding: 12px 16px; }
.aos-fh { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 10px; letter-spacing: .22em; color: #8b93c4; margin-bottom: 6px; text-transform: uppercase; }
.aos-fl { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12px; padding: 4px 0; color: #d7dcff; border-top: 1px solid rgba(255,255,255,.05); animation: aosIn .4s ease; }
.aos-fl b { color: var(--c); text-shadow: 0 0 10px var(--c); font-weight: 700; }
.aos-fl span { color: #6f78a8; }
.aos-panel { flex: 1 1 300px; max-width: 100%; padding: 20px; transition: box-shadow .4s; }
.aos-panel > div { animation: aosIn .35s ease; }
.aos-pk { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: #8b93c4; margin-bottom: 6px; }
.aos-pn { font-size: 26px; font-weight: 900; line-height: 1.1; background: linear-gradient(90deg, #fff, var(--c)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px var(--c)); }
.aos-pr { font-size: 13px; color: var(--c); margin-top: 6px; letter-spacing: .04em; }
.aos-pv { font-size: 14px; color: #dde2ff; line-height: 1.55; margin-top: 10px; }
.aos-sec { margin-top: 18px; }
.aos-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.aos-chip { font-size: 12px; padding: 4px 11px; border-radius: 999px; border: 1px solid rgba(255,61,129,.5); color: #ff9dc0; background: rgba(255,61,129,.08); box-shadow: 0 0 14px -6px #ff3d81; }
.aos-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 9px 12px; margin-top: 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); cursor: pointer; font-size: 13px; color: #E9ECFF; transition: all .2s; }
.aos-row:hover { border-color: var(--c); box-shadow: 0 0 22px -8px var(--c), inset 0 0 20px -14px var(--c); transform: translateX(3px); }
.aos-row.on { border-color: var(--c); background: rgba(255,255,255,.06); }
.aos-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); animation: aosPulse 2s infinite; }
.aos-tag { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; padding: 3px 8px; border-radius: 5px; margin-left: auto; }
.aos-tag.A { color: #ffc94d; border: 1px solid rgba(255,201,77,.55); background: rgba(255,201,77,.1); box-shadow: 0 0 12px -4px #ffc94d; }
.aos-tag.F { color: #04060f; background: linear-gradient(90deg, #ffffff, #bdf6ff); border: 1px solid #fff; box-shadow: 0 0 14px -2px #bdf6ff; }
.aos-ladder { border-radius: 14px; padding: 14px; background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.01)); border: 1px solid rgba(255,255,255,.08); }
.aos-rung { border-left: 3px solid rgba(255,255,255,.12); padding: 5px 0 5px 11px; margin-top: 9px; opacity: .45; transition: all .35s; }
.aos-rung.on { opacity: 1; border-left-color: var(--c); box-shadow: -8px 0 18px -12px var(--c); }
.aos-rung b { font-size: 11px; letter-spacing: .14em; color: var(--c); }
.aos-rung p { margin: 4px 0 0; font-size: 12.5px; color: #b8c3e6; line-height: 1.45; }
.aos-cnt { float: right; font-size: 11px; color: #9aa6c4; }
.aos-foot { margin-top: 20px; font-size: 12px; color: #7b83b4; text-align: center; line-height: 1.5; position: relative; z-index: 2; }
.aos-snd.on { background: linear-gradient(160deg, rgba(93,255,154,.25), rgba(93,255,154,.06)); border-color: rgba(93,255,154,.7); color: #b6ffd2; box-shadow: 0 0 16px -4px #5dff9a; }
.aos-snd i { display: inline-block; width: 3px; margin-right: 2px; background: currentColor; vertical-align: -1px; border-radius: 1px; }
.aos-snd.on i { animation: aosEq .9s ease-in-out infinite; }
.aos-snd i:nth-child(2) { animation-delay: .2s !important; } .aos-snd i:nth-child(3) { animation-delay: .45s !important; margin-right: 7px; }
@keyframes aosEq { 0%,100% { height: 4px } 50% { height: 11px } }
.aos-x { float: right; position: relative; z-index: 3; margin: -4px -4px 8px 8px; }
.aos-root.full { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; padding: 0; border-radius: 0; overflow: hidden; }
.full .aos-top { position: absolute; z-index: 5; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); pointer-events: none; align-items: flex-start; }
.full .aos-title { font-size: clamp(22px, 3.2vw, 40px); margin-top: 6px; }
.full .aos-sub { display: none; }
.full .aos-stats { pointer-events: auto; gap: 8px; }
.full .aos-stat { padding: 6px 12px; min-width: 0; border-radius: 12px; }
.full .aos-stat b { font-size: 18px; }
.full .aos-main { position: absolute; inset: 0; margin: 0; display: block; z-index: 1; }
.full .aos-col { position: absolute; inset: 0; display: block; }
.full .aos-stage { position: absolute; inset: 0; height: 100%; border-radius: 0; border: none; box-shadow: none; }
.full .aos-hud { top: calc(max(12px, env(safe-area-inset-top)) + 66px); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); }
.full .aos-corner { display: none; }
.full .aos-feed { position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: min(460px, calc(100% - 24px)); padding: 8px 12px; }
.full .aos-panel { position: absolute; z-index: 6; right: max(12px, env(safe-area-inset-right)); top: calc(max(12px, env(safe-area-inset-top)) + 66px); bottom: max(12px, env(safe-area-inset-bottom)); width: 370px; max-width: calc(100% - 24px); overflow-y: auto; -webkit-overflow-scrolling: touch; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; }
.full .aos-panel.hide { transform: translateX(115%); opacity: 0; pointer-events: none; }
.full .aos-foot { display: none; }
@media (max-width: 760px) {
  .full .aos-stats { display: none; }
  .full .aos-fl:nth-child(n+4) { display: none; }
  .full .aos-panel { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); top: auto; bottom: max(8px, env(safe-area-inset-bottom)); width: auto; max-width: none; max-height: 42dvh; padding: 16px; }
  .full .aos-panel.hide { transform: translateY(115%); }
  .full .aos-pn { font-size: 22px; }
}
